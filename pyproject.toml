[project]
name = "hexlet-code"
version = "0.1.0"
description = "Набор консольных игр на сообразительность. Создано в рамках проекта курса программирования на python онлайн-школы Hexlet."
readme = "README.md"
authors = [
    { name = "bebra228pro", email = "microsoftvladislav99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
brain-games = "brain_games.scripts.brain_games:main"
brain-even = "brain_games.games.brain_even:main"
brain-calc = "brain_games.games.brain_calc:main"
brain-gcd = "brain_games.games.brain_gcd:main"
brain-progression = "brain_games.games.brain_progression:main"
brain-prime = "brain_games.games.brain_prime:main"

[tool.hatch.build.targets.wheel]
packages = ["brain_games"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
